name: jusicool_ios
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_svg: ^2.0.17

  flutter_native_splash: ^2.4.6

  email_validator: ^3.0.0

  flutter_screenutil: ^5.9.3

  url_launcher: ^6.2.1

  fl_chart: ^1.0.0

  intl: ^0.20.2

  path_provider: ^2.1.5

  jusicool_design_system: ^1.0.2

  dio: ^5.8.0+1

  get_it: ^8.0.3

  json_annotation: ^4.9.0

  flutter_dotenv: ^5.2.1

  cookie_jar: ^4.0.8

  dio_cookie_manager: ^3.2.0

  pretty_dio_logger: ^1.4.0

  go_router: ^16.0.0

  retrofit: ^4.5.0

  freezed_annotation: ^3.0.0

  riverpod: ^2.6.1

  flutter_riverpod: ^2.6.1
  
  rxdart: ^0.28.0
  flutter_lints: ^6.0.0
  animated_digit: ^3.2.3
  get: ^4.7.2


dev_dependencies:
  retrofit_generator: ^9.2.0
  json_serializable: ^6.9.5
  build_runner: ^2.5.4
  freezed: ^3.0.6


flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/JUSICOOL.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/data/news.json
    - assets/data/my_assets.json
    - assets/data/user_profile.json
    - assets/data/community_post_list.json
